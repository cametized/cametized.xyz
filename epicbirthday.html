
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the countdown to epicg birthday</title>
    <link rel="stylesheet" href="css/birthday.css">
    <link rel="icon" href="images/epicg.png" type="image/x-icon">

    <title>epicg birthday</title>
    <meta content="birthday for epicg" property="og:title" />
    <meta content="descrption" property="og:description" />
    <meta content="https://cametized.xyz/images/epicg.png" property="og:image" />
    <meta content="#808dff" data-react-helmet="true" name="theme-color" />


    <script src="scripts/poopbirthday.js" defer></script>
</head>
<body>
    <img src="images/epicg.png" class="spin" style="width: 25%; height: 10%;">

    <div class="container">
        <h1>cotundown</h1>
        <p>timer:</p>

        <div id="countdown">
            <div class="box">
                <div class="number" id="days">0</div>
                <div class="label">Days</div>
            </div>
            <div class="box">
                <div class="number" id="hours">0</div>
                <div class="label">Hours</div>
            </div>
            <div class="box">
                <div class="number" id="minutes">0</div>
                <div class="label">Minutes</div>
            </div>
            <div class="box">
                <div class="number" id="seconds">0</div>
                <div class="label">Seconds</div>
            </div>
        </div>
            <br>
            <p>happy birthday epicg</p>
            <br>
            <img src="images/cametized logo.png" class="spin" style="width: 25%; height: 10%;">
            <br>
            <br>
            <p>for epic:</p>
            
            <div class="password-box">
            <input type="password" id="password" placeholder="Enter">
            <button onclick="checkPassword()">checky</button>
            <p id="error"></p>
            <p id="secret" style="display: none;"></p>
        </div>
    </div>
    <img src="images/epicg.png" class="spin" style="width: 25%; height: 10%;">
</div>
</body>
</html>
